name = "charter-desk"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Only the workers.dev URL is used, protected by Cloudflare Access. Preview URLs stay off.
workers_dev = true
preview_urls = false

[observability]
enabled = true

[vars]
# "production" requires a valid Cloudflare Access login on every request.
# `npm run dev` overrides this to "dev" (see .dev.vars.example), which skips the check locally.
ENVIRONMENT = "production"
OWNER_EMAIL = "faixall@gmail.com"
# Cloudflare Access: team domain (e.g. https://yourteam.cloudflareaccess.com) and application AUD tag.
ACCESS_TEAM_DOMAIN = "https://omadhooinn.cloudflareaccess.com"
ACCESS_AUD = "6fe480b4e6348f21ba30087f11d2f63d190707f85a376fe4694d3763a915ab49"

[[d1_databases]]
binding = "DB"
database_name = "charter-desk"
database_id = "777ce008-d08b-4fce-8729-1d63535ef106"
migrations_dir = "migrations"
